# ============================================================================
# VitalTech QGS — nginx edge configuration
# Mounted at /etc/nginx/conf.d/default.conf (inside the http context).
#
# TLS certificates come from Let's Encrypt via certbot on the host:
#   /etc/letsencrypt/live/quotes.vitaltechmyanmar.com/{fullchain,privkey,chain}.pem
# The domain is fixed below; change it here and in APP_URL / AUTH_URL.
#
# If you later put an ALB + ACM in front of the instance:
#   - keep only the `listen 80` server below, drop the 301 redirect,
#   - enable the commented real_ip lines,
#   - security groups: ALB -> instance:80.
# ============================================================================

limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_status 429;

log_format qgs_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
  '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
  '"referer":"$http_referer","user_agent":"$http_user_agent",'
  '"request_id":"$request_id"}';

upstream qgs_app {
    server app:3000;
    keepalive 16;
}

# ---- HTTP: ACME challenge, health, redirect --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vitaltechmyanmar.com;

    server_tokens off;
    access_log /dev/stdout qgs_json;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # used by the container healthcheck; never proxied
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy is emitted by the app (nonce-based). Do not add
    # a second CSP here — browsers enforce the intersection of both.

    access_log /dev/stdout qgs_json;
    error_log  /dev/stderr warn;

    # logo uploads are capped at 1 MB in the app
    client_max_body_size 2m;

    # The upstream keeps its own name resolution; nginx re-resolves `app`
    # on reload, which `deploy.sh` does after every restart of the app.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;   # PDF generation can take a few seconds

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # optional when an ALB terminates TLS in front of this instance
    # set_real_ip_from 10.20.0.0/16;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location = /api/health {
        access_log off;
        proxy_pass http://qgs_app;
    }

    # Login and credential callbacks are throttled per source IP. Office staff
    # share one public IP, so keep the burst generous (30/min, burst 10).
    # Deliberately NOT applied to /api/auth/session, which the client polls.
    location = /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://qgs_app;
    }

    location ^~ /api/auth/callback/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://qgs_app;
    }

    location / {
        proxy_pass http://qgs_app;
    }
