limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_status 429;

log_format qgs_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
  '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
  '"referer":"$http_referer","user_agent":"$http_user_agent",'
  '"request_id":"$request_id"}';

upstream qgs_app {
    server app:3000;
    keepalive 16;
}

# HTTP origin — Cloudflare terminates public HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name quotes.vitaltechmyanmar.com;

    server_tokens off;
    access_log /dev/stdout qgs_json;
    error_log /dev/stderr warn;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/health {
        access_log off;
        proxy_pass http://qgs_app;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    location = /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://qgs_app;
    }

    location ^~ /api/auth/callback/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://qgs_app;
    }

    location / {
        proxy_pass http://qgs_app;
    }
}
