name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qgs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: vitaltech-qgs

jobs:
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qgs
          POSTGRES_PASSWORD: qgs
          POSTGRES_DB: qgs_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U qgs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://qgs:qgs@localhost:5432/qgs_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04

    outputs:
      image: ${{ steps.meta.outputs.image }}
      migrate: ${{ steps.meta.outputs.migrate }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "image=${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "migrate=${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}-migrate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: migrator
          push: true
          tags: ${{ steps.meta.outputs.migrate }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.QGS_INSTANCE_ID }}
          IMAGE: ${{ needs.build.outputs.image }}
          MIGRATE_IMAGE: ${{ needs.build.outputs.migrate }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Target EC2 instance: $INSTANCE_ID"
          echo "Application image: $IMAGE"
          echo "Migration image: $MIGRATE_IMAGE"

          # Confirm that the SSM target is online.
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text

          # Invoke the deployment script and pass both image tags.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "QGS deployment ${GITHUB_SHA}" \
            --parameters "{\"commands\":[\"set -eu; test -x /opt/vitaltech-qgs/deploy/deploy.sh || { echo 'Deployment script missing or not executable'; exit 1; }; /opt/vitaltech-qgs/deploy/deploy.sh '$IMAGE' '$MIGRATE_IMAGE'\"]}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to finish, but preserve its diagnostic output.
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM command completed."
          else
            echo "SSM waiter reported a failure; retrieving command details."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with SSM status: $STATUS"
            exit 1
          fi

      - name: Smoke test
        run: |
          curl -fsS \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            https://quotes.vitaltechmyanmar.com/api/health
