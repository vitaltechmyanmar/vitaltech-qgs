```yaml
name: ci-cd

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: qgs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: vitaltech-qgs

jobs:
  # ============================================================
  # 1. Verify application
  # ============================================================
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qgs
          POSTGRES_PASSWORD: qgs
          POSTGRES_DB: qgs_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U qgs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://qgs:qgs@localhost:5432/qgs_test?sslmode=disable

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build application
        run: pnpm build

  # ============================================================
  # 2. Build and push Docker images to ECR
  # ============================================================
  build:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-24.04

    outputs:
      image: ${{ steps.meta.outputs.image }}
      migrate: ${{ steps.meta.outputs.migrate }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "image=${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "migrate=${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}-migrate" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: migrator
          push: true
          tags: ${{ steps.meta.outputs.migrate }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  # ============================================================
  # 3. Deploy to EC2 using AWS Systems Manager
  # ============================================================
  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.QGS_INSTANCE_ID }}
          IMAGE: ${{ needs.build.outputs.image }}
          MIGRATE_IMAGE: ${{ needs.build.outputs.migrate }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Target EC2 instance: $INSTANCE_ID"
          echo "Application image: $IMAGE"
          echo "Migration image: $MIGRATE_IMAGE"

          # Send deployment command directly; no DescribeInstanceInformation required.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "QGS deployment ${GITHUB_SHA}" \
            --parameters "commands=set -eu; chmod 750 /opt/vitaltech-qgs/deploy/deploy.sh; test -x /opt/vitaltech-qgs/deploy/deploy.sh; /opt/vitaltech-qgs/deploy/deploy.sh '$IMAGE' '$MIGRATE_IMAGE'" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the remote command to finish.
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "SSM command completed."
          else
            echo "SSM command reported a failure; collecting diagnostics."
          fi

          # Retrieve output even when the SSM command fails.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with SSM status: $STATUS"
            exit 1
          fi

      - name: Smoke test
        run: |
          curl -fsS \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            https://quotes.vitaltechmyanmar.com/api/health
```
